[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serenie"
version = "0.1.0"
description = "A sovereign, deterministic engineering execution substrate"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "davidlee888686"}
]
keywords = ["engineering", "substrate", "deterministic", "execution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.9"
dependencies = [
  "aiohttp==3.14.3",
  "cryptography==50.0.2",
  "PyYAML==6.0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=0.21",
  "pip-audit>=2.6",
]

[project.urls]
Homepage = "https://github.com/davidlee888686/serenie-public"
Documentation = "https://github.com/davidlee888686/serenie-public/tree/main/docs"
Repository = "https://github.com/davidlee888686/serenie-public.git"
Issues = "https://github.com/davidlee888686/serenie-public/issues"

[project.scripts]
serenie = "serenie.public_cli:main"

[tool.setuptools.packages.find]
include = ["serenie", "serenie.*", "kernel", "kernel.*", "runtime", "runtime.*"]
exclude = ["serenie.tests", "serenie.tests.*"]

[tool.pytest.ini_options]
testpaths = ["tests", "serenie/tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.setuptools.package-data]
serenie = ["py.typed"]
